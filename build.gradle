plugins {
    id 'java'
    id 'war'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

configurations {
    // Исключаем возможные javax зависимости
    all*.exclude group: 'javax', module: 'javaee-api'
    all*.exclude group: 'javax', module: 'javax.faces-api'
    all*.exclude group: 'javax', module: 'javax.servlet-api'
}

dependencies {
    // PrimeFaces для Jakarta EE 10
    implementation 'org.primefaces:primefaces:13.0.0:jakarta'

    // JSF API (только API, реализация предоставляется WildFly)
    compileOnly 'jakarta.faces:jakarta.faces-api:4.0.1'

    // Servlet API (только для компиляции)
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'

    // CDI API
    compileOnly 'jakarta.enterprise:jakarta.enterprise.cdi-api:4.0.1'

    // JPA
    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    implementation 'org.hibernate.orm:hibernate-core:6.2.7.Final'

    // JSON
    implementation 'com.google.code.gson:gson:2.10.1'

    // JSTL (если используется)
    implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:3.0.0'
    implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1'
}

war {
    archiveFileName = 'webapp.war'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude '**/javax/**'
    exclude '**/META-INF/**/*.jar'
}

compileJava {
    options.encoding = 'UTF-8'
}