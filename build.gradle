plugins {
    id 'java'
    id 'war'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Hibernate JPA (ORM)
    implementation 'org.hibernate.orm:hibernate-core:6.2.7.Final'

    // Для работы с Oracle
    implementation 'com.oracle.database.jdbc:ojdbc11:23.3.0.23.09'

    // JTA API (для transaction-type="JTA")
    implementation 'jakarta.transaction:jakarta.transaction-api:2.0.1'

    // JPA API
    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    // JSON
    implementation 'com.google.code.gson:gson:2.10.1'

    // Servlet (Jakarta)
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'
    implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:3.0.0'
    implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1'

    // JSF 4.0 (Jakarta)
    implementation 'jakarta.faces:jakarta.faces-api:4.0.1'
    implementation 'org.glassfish:jakarta.faces:4.0.1'

    // PrimeFaces
    implementation 'org.primefaces:primefaces:13.0.0'

    // CDI (Jakarta) - без событий
    implementation 'jakarta.enterprise:jakarta.enterprise.cdi-api:4.0.1'
    implementation 'jakarta.inject:jakarta.inject-api:2.0.1'
    implementation 'org.jboss.weld.servlet:weld-servlet-core:5.1.0.Final'
}

war {
    archiveFileName = 'webapp.war'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

compileJava {
    options.encoding = 'UTF-8'
}