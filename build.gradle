plugins {
    id 'java'
    id 'war'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

configurations {
    all {
        // Исключаем javax зависимости (для перехода на Jakarta EE 10)
        exclude group: 'javax', module: 'javaee-api'
        exclude group: 'javax', module: 'javax.faces-api'
        exclude group: 'javax', module: 'javax.servlet-api'
        exclude group: 'javax', module: 'javax.enterprise.api'
        exclude group: 'javax', module: 'javax.persistence-api'
        exclude group: 'javax', module: 'javax.annotation-api'
    }
}

dependencies {
    // PrimeFaces для Jakarta EE 10
    implementation 'org.primefaces:primefaces:13.0.0:jakarta'

    // Jakarta EE API (только для компиляции)
    compileOnly 'jakarta.faces:jakarta.faces-api:4.0.1'
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'
    compileOnly 'jakarta.enterprise:jakarta.enterprise.cdi-api:4.0.1'
    compileOnly 'jakarta.persistence:jakarta.persistence-api:3.1.0'

    // Hibernate (будет использоваться из сервера, но нужен для компиляции)
    implementation 'org.hibernate.orm:hibernate-core:6.2.7.Final'

    // JSON
    implementation 'com.google.code.gson:gson:2.10.1'

    // Для JSTL (если используется)
    compileOnly 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:3.0.0'
}

war {
    archiveFileName = 'webapp.war'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // Удаляем лишние файлы
    exclude '**/javax/**'
    exclude '**/META-INF/versions/**'
    exclude '**/*.jar'

    // Включаем jboss-deployment-structure.xml
    from('src/main/resources') {
        include 'jboss-deployment-structure.xml'
        into 'WEB-INF'
    }
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-parameters']
}