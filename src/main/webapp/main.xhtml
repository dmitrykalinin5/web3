<!DOCTYPE html>
<html lang="ru" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<!-- Не удаляйте эту строчку! -->
<f:view>
    <!-- Не удаляйте эту строчку! -->
    <h:head>
        <!-- Не удаляйте эту строчку! -->
        <title>Point Checker - Проверка точек</title>
        <!-- Не удаляйте эту строчку! -->
        <meta charset="UTF-8" />
        <!-- Не удаляйте эту строчку! -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <!-- Не удаляйте эту строчку! -->
        <h:outputStylesheet library="css" name="styles.css"/>
        <!-- Не удаляйте эту строчку! -->
        <h:outputScript library="js" name="script.js"/>

        <!-- Добавьте этот скрипт для обработки PrimeFaces -->
        <script type="text/javascript">
            function handleFormComplete(xhr, status, args) {
                if (args &amp;&amp; !args.validationFailed) {
                    // Обновляем график после успешной отправки
                    updateGraphAfterSubmit();

                    // Очищаем сообщения об ошибках
                    hideValidationError();

                    // Показываем уведомление об успехе
                    showSuccessMessage("Точка успешно проверена!");
                }
            }

            function showSuccessMessage(message) {
                // Создаем уведомление об успехе
                const notification = document.createElement('div');
                notification.className = 'success-notification';
                notification.textContent = message;
                notification.style.cssText = `
                    position: fixed;
                    top: 20px;
                    right: 20px;
                    background: #28a745;
                    color: white;
                    padding: 15px 25px;
                    border-radius: 10px;
                    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
                    z-index: 10000;
                    font-weight: 600;
                    animation: slideInRight 0.3s ease-out;
                `;

                document.body.appendChild(notification);

                setTimeout(() => {
                    notification.style.animation = 'slideOutRight 0.3s ease-in';
                    setTimeout(() => {
                        document.body.removeChild(notification);
                    }, 300);
                }, 3000);
            }
        </script>
    </h:head>
    <h:body>
        <div class="container">
            <div class="header">
                <h1>Проверка попадания точки в область</h1>
                <h:link outcome="goToIndex" value="Вернуться на стартовую страницу" styleClass="back-link"/>
            </div>

            <h:form id="pointForm">
                <div class="form-section">
                    <h3>Координата X:</h3>
                    <p:selectOneMenu id="x" value="#{pointBean.x}" required="true" requiredMessage="Выберите значение X">
                        <f:selectItem itemLabel="Выберите X" itemValue=""/>
                        <f:selectItem itemValue="-4" itemLabel="-4"/>
                        <f:selectItem itemValue="-3" itemLabel="-3"/>
                        <f:selectItem itemValue="-2" itemLabel="-2"/>
                        <f:selectItem itemValue="-1" itemLabel="-1"/>
                        <f:selectItem itemValue="0" itemLabel="0"/>
                        <f:selectItem itemValue="1" itemLabel="1"/>
                        <f:selectItem itemValue="2" itemLabel="2"/>
                        <f:selectItem itemValue="3" itemLabel="3"/>
                        <f:selectItem itemValue="4" itemLabel="4"/>
                    </p:selectOneMenu>
                    <h:message for="x" styleClass="error-message"/>
                </div>

                <div class="form-section">
                    <h3>Координата Y:</h3>
                    <p:inputText id="y" value="#{pointBean.y}" required="true"
                                 requiredMessage="Введите значение Y"
                                 validatorMessage="Y должен быть от -3 до 5">
                        <f:validateDoubleRange minimum="-3" maximum="5"/>
                    </p:inputText>
                    <h:message for="y" styleClass="error-message"/>
                </div>

                <div class="form-section">
                    <h3>Радиус R:</h3>
                    <p:selectOneMenu id="r" value="#{pointBean.r}" required="true" requiredMessage="Выберите значение R">
                        <f:selectItem itemLabel="Выберите R" itemValue=""/>
                        <f:selectItem itemValue="1" itemLabel="1"/>
                        <f:selectItem itemValue="1.5" itemLabel="1.5"/>
                        <f:selectItem itemValue="2" itemLabel="2"/>
                        <f:selectItem itemValue="2.5" itemLabel="2.5"/>
                        <f:selectItem itemValue="3" itemLabel="3"/>
                    </p:selectOneMenu>
                    <h:message for="r" styleClass="error-message"/>
                </div>

                <p:commandButton value="Проверить точку" action="#{pointBean.checkPoint}"
                                 update="resultsTable x y r"
                                 oncomplete="handleFormComplete(xhr, status, args)"
                                 styleClass="submit-btn"/>

                <!-- Скрытые поля для клика по графику -->
                <h:inputHidden id="graphX" value="#{pointBean.graphX}"/>
                <h:inputHidden id="graphY" value="#{pointBean.graphY}"/>

                <!-- Скрытая кнопка для графика -->
                <p:commandButton id="graphSubmitBtn" action="#{pointBean.checkPointFromGraph}"
                                 process="@this graphX graphY r"
                                 update="resultsTable"
                                 oncomplete="handleFormComplete(xhr, status, args)"
                                 style="display:none;"/>
            </h:form>

            <div class="graph-section">
                <h3>График области</h3>
                <canvas id="graphCanvas" width="400" height="400"></canvas>
                <div class="graph-instructions">
                    <small>Кликните на графике, чтобы добавить точку. Значение X будет автоматически округлено.</small>
                </div>
            </div>

            <div class="results-section">
                <h3>Результаты проверок</h3>
                <p:dataTable id="resultsTable" value="#{resultsBean.allResults}" var="result"
                             styleClass="results-table" paginator="true" rows="10" widgetVar="resultsTableWidget">
                    <p:column headerText="X">
                        <h:outputText value="#{result.x}"/>
                    </p:column>
                    <p:column headerText="Y">
                        <h:outputText value="#{result.y}">
                            <f:convertNumber maxFractionDigits="2"/>
                        </h:outputText>
                    </p:column>
                    <p:column headerText="R">
                        <h:outputText value="#{result.r}">
                            <f:convertNumber maxFractionDigits="2"/>
                        </h:outputText>
                    </p:column>
                    <p:column headerText="Результат">
                        <h:outputText value="#{result.hit ? 'Попадание' : 'Промах'}"
                                      styleClass="#{result.hit ? 'hit' : 'miss'}"/>
                    </p:column>
                    <p:column headerText="Время">
                        <h:outputText value="#{result.timestamp}">
                            <f:convertDateTime pattern="HH:mm:ss" timeZone="Europe/Moscow"/>
                        </h:outputText>
                    </p:column>
                </p:dataTable>
            </div>
        </div>
    </h:body>
</f:view>
</html>
