<!DOCTYPE html>
<html lang="ru" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<f:view>
    <h:head>
        <title>Wiki.js Встраивание</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <style>
            .wiki-container {
                width: 100%;
                height: 600px;
                border: 1px solid #ddd;
                border-radius: 8px;
                overflow: hidden;
            }
            .wiki-iframe {
                width: 100%;
                height: 100%;
                border: none;
            }
        </style>
    </h:head>
    <h:body>
        <div class="container">
            <div class="header">
                <h1>Математические материалы</h1>
                <p>Статья из Wiki.js по теме выбранного радиуса</p>
            </div>

            <div class="wiki-container">
                <iframe src="#{wikiBean.articleUrl}"
                        class="wiki-iframe"
                        sandbox="allow-same-origin allow-scripts allow-forms allow-popups"
                        title="Wiki.js Content">
                </iframe>
            </div>

            <div class="wiki-info">
                <p>
                    Эта статья загружается из системы Wiki.js в реальном времени.
                    Для радиуса R = #{wikiBean.currentRadius} показана соответствующая математическая статья.
                </p>
            </div>
        </div>
    </h:body>
</f:view>
</html>
