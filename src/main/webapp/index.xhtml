<!DOCTYPE html>
<html lang="ru" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<f:view>
    <h:head>
        <title>Point Checker - Стартовая страница</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <h:outputStylesheet name="css/styles.css"/>
    </h:head>
    <h:body>
        <div class="container">
            <div class="header">
                <h1>Калинин Дмитрий Викторович</h1>
                <h2>Группа: P3209 | Вариант: 466088</h2>
            </div>

            <div class="clock-container">
                <h3>Текущее время:</h3>
                <h:outputText value="#{timeBean.currentTime}">
                    <f:convertDateTime pattern="dd.MM.yyyy HH:mm:ss" timeZone="Europe/Moscow"/>
                </h:outputText>
            </div>

            <div class="navigation">
                <h:link outcome="goToMain" value="Перейти к приложению" styleClass="nav-link"/>
            </div>
        </div>

        <script>
            // Обновление времени каждые 10 секунд
            setInterval(function() {
                window.location.reload();
            }, 10000);
        </script>
    </h:body>
</f:view>
</html>
