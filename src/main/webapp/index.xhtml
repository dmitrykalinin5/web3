<!DOCTYPE html>
<html lang="ru" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<f:view>
    <h:head>
        <title>Point Checker - Стартовая страница</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <h:outputStylesheet name="css/styles.css"/>
        <link rel="stylesheet" type="text/css" href="#{facesContext.externalContext.requestContextPath}/resources/css/styles.css"/>
    </h:head>
    <h:body>

        <div class="container">
            <div class="header">
                <h1>Калинин Дмитрий Викторович</h1>
                <h2>Группа: P3209 | Вариант: 411</h2>
            </div>

            <div class="clock-container">
                <h3>Текущее время:</h3>
                <div id="clock-display" style="font-size: 2em; font-weight: bold; color: #333; margin: 20px 0;">
                    Загрузка времени...
                </div>
            </div>

            <div class="navigation">
                <h:link outcome="goToMain" value="Перейти к приложению" styleClass="nav-link"/>
            </div>
        </div>

        <script>
            function updateClock() {
                const now = new Date();

                // Опции для времени
                const timeOptions = {
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                };

                // Опции для даты
                const dateOptions = {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric'
                };

                // Формируем строку: Дата + Время
                const dateString = now.toLocaleDateString('ru-RU', dateOptions);
                const timeString = now.toLocaleTimeString('ru-RU', timeOptions);

                document.getElementById('clock-display').innerText = dateString + ' ' + timeString;
            }

            // Запускаем сразу
            updateClock();

            // Обновляем раз в 10 секунд (10000 мс)
            setInterval(updateClock, 10000);
        </script>
    </h:body>
</f:view>
</html>
