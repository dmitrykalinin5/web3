<!DOCTYPE html>
<html lang="ru" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<f:view>
    <h:head>
        <title>Архитектурные решения (ADR)</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <h:outputStylesheet library="css" name="styles.css"/>
    </h:head>
    <h:body>
        <div class="container">
            <h:form id="mainForm">
                <div class="header">
                    <h1>Архитектурные решения (ADR)</h1>
                    <p>Всего загружено ADR: #{adrBean.allADRs.size()}</p>
                    <div class="header-links">
                        <h:link outcome="/main.xhtml" value="Вернуться к приложению" styleClass="back-link"/>
                        <p:commandButton value="🔄 Обновить"
                                         action="#{adrBean.loadAllADRs}"
                                         update=":contentForm"
                                         styleClass="refresh-btn"/>
                    </div>
                </div>
            </h:form>

            <h:form id="contentForm">
                <p:growl id="growl" showDetail="true" />

                <p:panel rendered="#{empty adrBean.allADRs}">
                    <p>ADR не найдены. Проверьте папку <code>webapp/adr/</code></p>
                </p:panel>

                <h:panelGroup id="adrContainer" layout="block" rendered="#{not empty adrBean.allADRs}">
                    <p:dataList id="adrList" value="#{adrBean.allADRs}" var="adr" type="unordered" itemType="none">
                        <p:panel header="[#{adr.id}] #{adr.title}" styleClass="adr-card" style="margin-bottom: 20px">
                            <div class="adr-content">
                                <p><strong>Статус:</strong> <h:outputText value=" #{adr.status}" /></p>

                                <h4>Контекст</h4>
                                <h:outputText value="#{adr.context}" escape="false" />

                                <h4>Решение</h4>
                                <h:outputText value="#{adr.decision}" escape="false" />

                                <h4>Последствия</h4>
                                <h:outputText value="#{adr.consequences}" escape="false" />

                                <hr/>
                                <div class="adr-meta">
                                    <small>Файл: #{adr.filename}</small>
                                </div>
                            </div>
                        </p:panel>
                    </p:dataList>
                </h:panelGroup>
            </h:form>
        </div>
    </h:body>
</f:view>
</html>
